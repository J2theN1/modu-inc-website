name: Domain health probe

on:
  pull_request:
    paths:
      - .github/workflows/domain-health-probe.yml
      - CNAME
      - index.html
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read
  pages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and probe custom domain
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          domain='moduindustries.ca'
          www="www.$domain"

          echo '=== DNS ==='
          python3 - "$domain" "$www" <<'PY'
          import socket
          import sys
          for host in sys.argv[1:]:
              try:
                  rows = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  addresses = sorted({row[4][0] for row in rows})
                  print(f"{host}={','.join(addresses)}")
              except Exception as exc:
                  print(f"{host}=ERROR:{type(exc).__name__}:{exc}")
          PY

          echo '=== PAGES API ==='
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/pages" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps({k:p.get(k) for k in ("status","html_url","cname","https_enforced","protected_domain_state","pending_domain_unverified_at","https_certificate")},sort_keys=True))'

          echo '=== HTTP ==='
          curl --silent --show-error --location --head \
            --connect-timeout 10 --max-time 30 \
            --write-out 'RESULT http_code=%{http_code} final=%{url_effective} verify=%{ssl_verify_result}\n' \
            "http://$domain/" || true

          echo '=== HTTPS APEX ==='
          curl --silent --show-error --location --head \
            --connect-timeout 10 --max-time 30 \
            --write-out 'RESULT http_code=%{http_code} final=%{url_effective} verify=%{ssl_verify_result}\n' \
            "https://$domain/" || true

          echo '=== HTTPS WWW ==='
          curl --silent --show-error --location --head \
            --connect-timeout 10 --max-time 30 \
            --write-out 'RESULT http_code=%{http_code} final=%{url_effective} verify=%{ssl_verify_result}\n' \
            "https://$www/" || true

          echo '=== TLS CERTIFICATE ==='
          timeout 20 openssl s_client -connect "$domain:443" -servername "$domain" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
