name: Enable Pages HTTPS

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read
  pages: write

concurrency:
  group: enable-pages-https
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable HTTPS after certificate approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          domain='moduindustries.ca'
          www="www.$domain"
          api="https://api.github.com/repos/$REPOSITORY/pages"
          headers=(
            -H 'Accept: application/vnd.github+json'
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'X-GitHub-Api-Version: 2026-03-10'
          )

          pages_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api")"
          printf '%s\n' "$pages_json" | python3 -c '
          import json, sys
          p = json.load(sys.stdin)
          cert = p.get("https_certificate") or {}
          print(json.dumps({
              "status": p.get("status"),
              "cname": p.get("cname"),
              "https_enforced": p.get("https_enforced"),
              "certificate_state": cert.get("state"),
              "certificate_domains": cert.get("domains", []),
          }, sort_keys=True))
          '

          PAGES_JSON="$pages_json" python3 - "$domain" "$www" <<'PY'
          import json
          import os
          import sys

          apex, www = sys.argv[1:]
          payload = json.loads(os.environ["PAGES_JSON"])
          if payload.get("status") != "built":
              raise SystemExit("Pages is not built")
          if payload.get("cname") != apex:
              raise SystemExit("Pages custom domain mismatch")
          if payload.get("https_enforced"):
              print("HTTPS_ALREADY_ENFORCED=1")
              raise SystemExit(20)
          certificate = payload.get("https_certificate") or {}
          domains = set(certificate.get("domains") or [])
          if certificate.get("state") != "approved" or not {apex, www}.issubset(domains):
              print("HTTPS_CERTIFICATE_PENDING=1")
              raise SystemExit(21)
          print("HTTPS_CERTIFICATE_APPROVED=1")
          PY
          decision=$?

          if [[ "$decision" -eq 20 ]]; then
            exit 0
          fi
          if [[ "$decision" -eq 21 ]]; then
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request PUT \
            "${headers[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"https_enforced":true}' \
            "$api" \
            --output /dev/null

          verified_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api")"
          PAGES_JSON="$verified_json" python3 - "$domain" <<'PY'
          import json
          import os
          import sys

          domain = sys.argv[1]
          payload = json.loads(os.environ["PAGES_JSON"])
          if payload.get("cname") != domain:
              raise SystemExit("Pages custom domain changed during HTTPS update")
          if not payload.get("https_enforced"):
              raise SystemExit("HTTPS update was not persisted")
          print("HTTPS_ENFORCED=1")
          PY
